<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="frambuesaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4081" />
      <stop offset="100%" stop-color="#E91E63" />
    </linearGradient>
    <linearGradient id="trigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA8A" />
      <stop offset="100%" stop-color="#C5A076" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#5D4037" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fondo Circular Crema -->
  <circle cx="60" cy="60" r="54" fill="#FDF4E0" stroke="#C5A076" stroke-width="2.5" filter="url(#softShadow)" />
  
  <!-- Anillo Decorativo Interior -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#5D4037" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.6" />

  <!-- Espigas de Trigo Laterales -->
  <g fill="url(#trigoGrad)" opacity="0.85">
    <!-- Izquierda -->
    <path d="M 28 65 Q 24 55 30 48 Q 32 56 28 65 Z" />
    <path d="M 24 56 Q 19 49 27 44 Q 28 51 24 56 Z" />
    <path d="M 33 52 Q 28 43 36 40 Q 36 48 33 52 Z" />
    <!-- Derecha -->
    <path d="M 92 65 Q 96 55 90 48 Q 88 56 92 65 Z" />
    <path d="M 96 56 Q 101 49 93 44 Q 92 51 96 56 Z" />
    <path d="M 87 52 Q 92 43 84 40 Q 84 48 87 52 Z" />
  </g>

  <!-- Gorro de Chef / Pastelero Artesanal -->
  <!-- Base del Gorro -->
  <rect x="42" y="66" width="36" height="11" rx="4" fill="#5D4037" />
  <rect x="44" y="68" width="32" height="7" rx="2.5" fill="#C5A076" />
  
  <!-- Pliegues del Gorro -->
  <path d="M 39 65 C 34 50 48 40 54 44 C 58 36 68 36 71 43 C 78 39 88 50 81 65 Z" fill="#FFFFFF" stroke="#5D4037" stroke-width="2" />
  <path d="M 50 65 C 48 55 52 48 56 46" fill="none" stroke="#E0D2C0" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 60 65 C 60 52 61 46 63 43" fill="none" stroke="#E0D2C0" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 70 65 C 72 55 70 48 68 45" fill="none" stroke="#E0D2C0" stroke-width="1.8" stroke-linecap="round" />

  <!-- Frambuesa / Fresa Central -->
  <g transform="translate(60, 84)">
    <!-- Fruta Frambuesa -->
    <path d="M 0 -7 C 8 -7 10 2 0 11 C -10 2 -8 -7 0 -7 Z" fill="url(#frambuesaGrad)" filter="url(#softShadow)" />
    <!-- Hojitas Verdes -->
    <path d="M 0 -7 Q -4 -11 -7 -9 Q -3 -6 0 -7 Z" fill="#4CAF50" />
    <path d="M 0 -7 Q 4 -11 7 -9 Q 3 -6 0 -7 Z" fill="#4CAF50" />
    <circle cx="0" cy="-7" r="1.5" fill="#388E3C" />
    <!-- Brillo en la fruta -->
    <ellipse cx="-2.5" cy="-2" rx="1.5" ry="3" fill="#FFFFFF" opacity="0.4" transform="rotate(-20 -2.5 -2)" />
  </g>

  <!-- Estrellitas Doradas -->
  <polygon points="60,26 62,30 66,31 63,34 64,38 60,36 56,38 57,34 54,31 58,30" fill="#FFC107" />
</svg>
